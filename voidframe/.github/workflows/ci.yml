name: Validate VOIDFRAME
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: npm test
        working-directory: skills/voidframe/assets/starter
  starter-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: skills/voidframe/assets/starter
      - run: npm run build
        working-directory: skills/voidframe/assets/starter
